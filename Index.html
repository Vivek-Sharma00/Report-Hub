<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Hub - Live Crowdsourced Mapping Platform</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0b1528;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            color: white;
        }

        #map { width: 100%; height: 100%; z-index: 1; }

        /* Auth Screen Shield Over Map Backdrop */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b1528; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .auth-card {
            background: #121620; padding: 30px; border-radius: 20px;
            width: 90%; max-width: 360px; border: 1px solid #222b3e; text-align: center;
        }
        .auth-card h2 { margin-top: 0; color: #00e5ff; }
        .auth-card input {
            width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box;
            background: #1c2333; border: 1px solid #222b3e; color: white; border-radius: 10px; outline: none;
        }
        .auth-card button {
            width: 100%; padding: 12px; background: #00e5ff; border: none;
            color: #090c15; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 10px;
        }
        .auth-toggle { font-size: 0.85rem; color: #8e9aa8; margin-top: 15px; cursor: pointer; display: inline-block; }

        /* Reporting Input Form Drawer Control Box */
        .report-panel {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 999; background: #121620; padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #222b3e;
            width: 90%; max-width: 400px; display: none; flex-direction: column; gap: 10px;
        }
        .report-panel h3 { margin: 0 0 5px 0; color: #ff4d4d; }
        .report-panel select, .report-panel input[type="file"] {
            width: 100%; padding: 10px; background: #1c2333; border: 1px solid #222b3e; color: white; border-radius: 8px;
        }
        .report-panel button {
            padding: 12px; background: #ff4d4d; color: white; border: none; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        
        /* Floating HUD Action Buttons */
        .hud-btn {
            position: fixed; top: 20px; right: 20px; z-index: 998;
            background: #121620; border: 1px solid #222b3e; padding: 12px 20px;
            border-radius: 30px; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #logoutBtn { right: unset; left: 20px; background: #222b3e; }

        /* Global Modal View Overlays */
        .story-backdrop {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); z-index: 9991;
            justify-content: center; align-items: center;
        }
        .story-card {
            background: #121620; width: 90%; max-width: 400px; border-radius: 20px;
            overflow: hidden; border: 1px solid #222b3e; position: relative;
        }
        .story-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222b3e; }
        .story-image { width: 100%; height: 230px; object-fit: cover; background: #090c15; }
        .story-content { padding: 15px; }
        .action-bar { display: flex; gap: 20px; padding-bottom: 10px; border-bottom: 1px solid #222b3e; }
        .comments-section { max-height: 120px; overflow-y: auto; margin-top: 10px; }
        .comment-bubble { background: #1c2333; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 0.85rem; }
        .comment-input-row { display: flex; padding: 10px 15px; background: #090c15; gap: 10px; }
        .comment-input-row input { flex: 1; background: #1c2333; border: 1px solid #222b3e; border-radius: 20px; padding: 8px 15px; color: white; outline: none; }
        .comment-input-row button { background: #00e5ff; border: none; border-radius: 20px; padding: 8px 15px; color: #090c15; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="auth-card">
            <h2 id="authTitle">Sign In to Report Hub</h2>
            <input type="email" id="authEmail" placeholder="Enter Email Address">
            <input type="password" id="authPassword" placeholder="Enter Security Password">
            <button id="authPrimaryBtn" onclick="handleAuthAction()">Continue</button>
            <span class="auth-toggle" id="authToggleLink" onclick="toggleAuthMode()">New here? Create a public community profile</span>
        </div>
    </div>

    <button class="hud-btn" id="logoutBtn" onclick="triggerSignOut()" style="display:none;">Sign Out</button>
    <button class="hud-btn" id="openReportPanelBtn" onclick="toggleReportPanel()" style="display:none;">🚨 File New Report</button>
    <div id="map"></div>

    <div class="report-panel" id="reportPanel">
        <h3>Report Local Infrastructure Issue</h3>
        
        <label style="font-size:0.8rem; color:#8e9aa8;">1. Select Category</label>
        <select id="reportCategory" onchange="checkCategorySelection()">
            <option value="Broken Road 🚧">Broken Road</option>
            <option value="Open Sewage Line 💧">Open Sewage Line</option>
            <option value="Garbage Pile up 🗑️">Garbage on Public Property</option>
            <option value="Electricity Down ⚡">Electricity Outage</option>
            <option value="Bribe/Corruption 🛑">Authority Taking Bribe</option>
            <option value="CUSTOM_OTHER">Other / Describe Custom Issue... 📝</option>
        </select>

        <div id="customCategoryContainer" style="display: none; flex-direction: column; gap: 5px; margin-top: 5px;">
            <label style="font-size:0.8rem; color:#00e5ff;">Write Your Custom Problem Name:</label>
            <input type="text" id="customCategoryText" placeholder="e.g., Damaged Streetlight, Fallen Tree" 
                   style="width: 100%; padding: 10px; background: #1c2333; border: 1px solid #222b3e; color: white; border-radius: 8px; box-sizing: border-box;">
        </div>
        
        <label style="font-size:0.8rem; color:#8e9aa8; margin-top: 5px;">2. Upload Structural Photo Proof</label>
        <input type="file" id="reportFile" accept="image/*">
        
        <button onclick="submitNewIncidentReport()">Upload & Pin Live Coordinates</button>
        <button style="background:#222b3e; margin-top:5px;" onclick="toggleReportPanel()">Cancel</button>
    </div>

    <div class="story-backdrop" id="storyModal">
        <div class="story-card">
            <div class="story-header">
                <span style="font-weight:bold;" id="modalCategory">Incident Category</span>
                <button style="background:none; border:none; color:grey; font-size:1.5rem; cursor:pointer;" onclick="closeStory()">&times;</button>
            </div>
            <img src="" class="story-image" id="modalImage">
            <div class="story-content">
                <div class="action-bar">
                    <div style="cursor:pointer; color:#00e5ff;" onclick="handleUpvote()">🔺 <span id="modalVotes">0</span> Same Here</div>
                    <div style="cursor:pointer; color:#ff4d4d;" onclick="flagAsSolved()">✅ Mark Solved</div>
                </div>
                <div class="comments-section" id="modalComments"></div>
            </div>
            <div class="comment-input-row">
                <input type="text" id="newCommentText" placeholder="Comment on this crisis...">
                <button onclick="submitComment()">Post</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByJPOxG9Pe4kj8ogMpRUBHK12BA-olSAo",
            authDomain: "report-hub-bfc1c.firebaseapp.com",
            projectId: "report-hub-bfc1c",
            storageBucket: "report-hub-bfc1c.firebasestorage.app",
            messagingSenderId: "690798254228",
            appId: "1:690798254228:web:99b19a23c64fe203cabc81"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let isSignUpMode = false;
        let activeReports = {};
        let currentOpenReportId = null;

        // Initialize Map Canvas View Layout 
        var map = L.map('map', { zoomControl: false }).setView([20.5937, 78.9629], 5);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);
        let heatLayer = L.heatLayer([], { radius: 35, blur: 20 }).addTo(map);
        let activeMarkers = [];

        // Auth Authentication State Engine Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('openReportPanelBtn').style.display = 'block';
                document.getElementById('logoutBtn').style.display = 'block';
                syncLiveDatabasePins();
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
                document.getElementById('openReportPanelBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'none';
            }
        });

        window.handleAuthAction = async function() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if(!email || !password) return alert("Please fill fields.");

            try {
                if (isSignUpMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) { alert(err.message); }
        }

        window.toggleAuthMode = function() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('authTitle').innerText = isSignUpMode ? "Register Account" : "Sign In to Report Hub";
            document.getElementById('authToggleLink').innerText = isSignUpMode ? "Already verified? Log in here" : "New here? Create a public community profile";
        }

        window.triggerSignOut = function() { signOut(auth); }
        window.toggleReportPanel = function() {
            const panel = document.getElementById('reportPanel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }

        // 5. GPS Geolocation Coordinate Interceptor
        window.submitNewIncidentReport = function() {
            if (!navigator.geolocation) return alert("GPS access denied by system settings.");
            
            alert("Fetching precise hardware satellite coordinates...");
            
            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const category = document.getElementById('reportCategory').value;
                const fileInput = document.getElementById('reportFile');
                
                let fileBase64 = "https://via.placeholder.com/400x250?text=No+Photo+Uploaded";
                
                // Read local binary file data safely using standard HTML Base64 pipeline converter
                if(fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    fileBase64 = await new Promise((res) => {
                        const reader = new FileReader();
                        reader.onloadend = () => res(reader.result);
                        reader.readAsDataURL(file);
                    });
                }

                const reportId = "report_" + Date.now();
                // Inject structural data configuration straight into core database
                await setDoc(doc(db, "reports", reportId), {
                    category: category,
                    photoUrl: fileBase64,
                    latitude: lat,
                    longitude: lng,
                    upvotes: 1,
                    status: "active",
                    comments: ["Incident point mapped dynamically via system GPS authentication logic."]
                });

                toggleReportPanel();
                map.setView([lat, lng], 14);
            }, (err) => alert("GPS Timeout Error: " + err.message));
        }

        // 6. Database Synchronization & Marker Injection Engines
        function syncLiveDatabasePins() {
            onSnapshot(collection(db, "reports"), (snapshot) => {
                let heatPoints = [];
                activeMarkers.forEach(m => map.removeLayer(m));
                activeMarkers = [];

                snapshot.docs.forEach(docSnap => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    
                    if (data.status === "active" && data.latitude && data.longitude) {
                        activeReports[id] = { id, ...data };
                        heatPoints.push([data.latitude, data.longitude, Math.min(data.upvotes / 10, 1.0)]);

                        let customIcon = L.divIcon({
                            className: 'snap-pin',
                            html: `<div style="width:38px; height:38px; border-radius:50%; border:3px solid #ff4d4d; background-image:url('${data.photoUrl}'); background-size:cover; background-position:center; box-shadow: 0 0 10px #ff4d4d;"></div>`,
                            iconSize: [38, 38], iconAnchor: [19, 19]
                        });

                        let marker = L.marker([data.latitude, data.longitude], { icon: customIcon })
                                      .addTo(map)
                                      .on('click', () => openStory(id));
                        activeMarkers.push(marker);
                    }
                });
                heatLayer.setLatLngs(heatPoints);
            });
        }

        // 7. Social Content Overlay Managers
        window.openStory = function(id) {
            currentOpenReportId = id;
            const report = activeReports[id];
            document.getElementById('modalCategory').innerText = report.category;
            document.getElementById('modalImage').src = report.photoUrl;
            document.getElementById('modalVotes').innerText = report.upvotes;
            
            const commentsContainer = document.getElementById('modalComments');
            commentsContainer.innerHTML = '';
            report.comments.forEach(c => {
                const bubble = document.createElement('div');
                bubble.className = 'comment-bubble';
                bubble.innerText = c;
                commentsContainer.appendChild(bubble);
            });
            document.getElementById('storyModal').style.display = 'flex';
        }

        window.closeStory = function() { document.getElementById('storyModal').style.display = 'none'; }

        window.handleUpvote = async function() {
            if(!currentOpenReportId) return;
            const ref = doc(db, "reports", currentOpenReportId);
            await updateDoc(ref, { upvotes: (activeReports[currentOpenReportId].upvotes || 0) + 1 });
            document.getElementById('modalVotes').innerText = activeReports[currentOpenReportId].upvotes;
        }

        window.submitComment = async function() {
            const txt = document.getElementById('newCommentText').value.trim();
            if(!txt || !currentOpenReportId) return;
            await updateDoc(doc(db, "reports", currentOpenReportId), { comments: arrayUnion(txt) });
            document.getElementById('newCommentText').value = '';
            openStory(currentOpenReportId);
        }

        // Flag as Solved (Removes it instantly from the map view array)
        window.flagAsSolved = async function() {
            if(!currentOpenReportId) return;
            if(confirm("Are you sure this issue is resolved? This action cleans it from the public feed.")) {
                await updateDoc(doc(db, "reports", currentOpenReportId), { status: "solved" });
                closeStory();
            }
        }
    </script>
</body>
</html>
